image: python:3.10

stages:
  - license-check
  - hidden-imports-check
  - analysis
  - test
  - post-merge
  - release


variables:
  UV_VERSION: "0.11"
  PYTHON_VERSION: "3.13"
  BASE_LAYER: trixie
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy

.uv: &uv
  variables:
    UV_CACHE_DIR: .uv-cache
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  script:
    - uv sync --frozen
    - uv cache prune --ci

license-check:
  <<: *uv
  stage: license-check
  script:
    - uv run python scripts/check_license_header.py

deptry:
  <<: *uv
  stage: hidden-imports-check
  script:
    - uv run deptry .

ruff:
  <<: *uv
  stage: analysis
  script:
    - uv run ruff check deepfellow/ tests/

ruff-format:
  <<: *uv
  stage: analysis
  script:
    - uv run ruff format --check deepfellow/ tests/

mypy:
  <<: *uv
  stage: analysis
  script:
    - uv run mypy deepfellow/ tests/

pyright:
  <<: *uv
  stage: analysis
  script:
    - PYRIGHT_PYTHON_NODE_VERSION=24.10.0 uv run pyright

check-version-bump:
  <<: *uv
  stage: analysis
  variables:
    UV_CACHE_DIR: .uv-cache
    # Full clone so all release tags are available for comparison.
    GIT_DEPTH: 0
  script:
    - command -v git >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends git)
    - git fetch --tags --quiet
    - |
      LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
      NEW_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
      echo "Last tag: ${LAST_TAG:-<none>}, New version: $NEW_VERSION"
      if [ -n "$LAST_TAG" ]; then
        LAST_VERSION=${LAST_TAG#v}
        if [ "$NEW_VERSION" = "$LAST_VERSION" ]; then
          echo "ERROR: version in pyproject.toml ($NEW_VERSION) was not bumped (still same as last tag $LAST_TAG)"
          exit 1
        fi
        HIGHEST=$(printf '%s\n%s\n' "$LAST_VERSION" "$NEW_VERSION" | sort -V | tail -1)
        if [ "$HIGHEST" != "$NEW_VERSION" ]; then
          echo "ERROR: version in pyproject.toml ($NEW_VERSION) is lower than last tag $LAST_TAG"
          exit 1
        fi
      fi
    - |
      if grep -q '## \[Unreleased\]' CHANGELOG.md; then
        echo "ERROR: CHANGELOG.md still has [Unreleased] section — rename it to the new version before release (see RELEASE.md)"
        exit 1
      fi
      CHANGELOG_VERSION=$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
      if [ -z "$CHANGELOG_VERSION" ]; then
        echo "ERROR: could not find a version section (## [X.Y.Z]) in CHANGELOG.md"
        exit 1
      fi
      if [ "$CHANGELOG_VERSION" != "$NEW_VERSION" ]; then
        echo "ERROR: top CHANGELOG.md version ($CHANGELOG_VERSION) does not match pyproject.toml version ($NEW_VERSION)"
        exit 1
      fi
  only:
    - /^release\/.*$/


pytest:
  <<: *uv
  stage: test
  script:
    - uv run pytest --showlocals --tb=auto -ra --cov deepfellow --cov-branch --cov-report=term-missing --cov-report xml:coverage_cli.xml --no-cov-on-fail tests/
  coverage: '/(?i)total.*? (100(?:\.0)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage_cli.xml

# Run the real install.sh against the current checkout under each supported
# package manager, then start the CLI — catches packaging / entry-point /
# startup crashes and install.sh dispatch regressions before release.
# DF_INSTALL_TARGET points install.sh at the local source instead of a remote
# git URL; each image exposes only one manager so install.sh selects that branch.
.smoke-test: &smoke-test
  stage: test
  variables:
    DF_INSTALL_TARGET: "."
    UV_TOOL_BIN_DIR: /usr/local/bin
    PIPX_BIN_DIR: /usr/local/bin
  script:
    - bash install.sh
    - export PATH="/usr/local/bin:$HOME/.local/bin:$PATH"
    - deepfellow version
    - deepfellow --help

smoke-test-uv:
  <<: *smoke-test
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER

smoke-test-pipx:
  <<: *smoke-test
  image: python:$PYTHON_VERSION
  before_script:
    - pip install --quiet pipx

smoke-test-pip:
  <<: *smoke-test
  image: python:$PYTHON_VERSION

push_to_github:
  stage: release
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - git fetch origin main
    - |
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main; then
        echo "Tag $CI_COMMIT_TAG ($CI_COMMIT_SHA) is not on main — aborting push to GitHub." >&2
        exit 1
      fi
    - git remote add github https://oauth2:${GITHUB_MIRROR_TOKEN}@github.com/simplito/deepfellow-cli.git
    - git push github HEAD:refs/heads/main
    - git push github $CI_COMMIT_TAG

create_issue_on_merge:
  image: hub.simplito.com/deepfellow/automatic-issue-creator:0.8.0
  stage: post-merge
  only:
    - main  # change to 'master' if that's your default branch
  script:
      - /work/script.sh
